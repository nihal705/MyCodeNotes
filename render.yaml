services:
  - type: web
    name: mycodenotes-api
    env: python
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mycodenotes-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: API_SECRET_KEY
        sync: false

databases:
  - name: mycodenotes-db
    plan: free